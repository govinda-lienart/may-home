<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Mayhome · Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --amber: #c8901a; --cream: #faf8f3; --sand: #f2ebe0; --bark: #2e1f0f; --muted: #7a6550; --leaf: #3f6b3a; --danger: #a3243b; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--cream); color: var(--bark); font-family: "DM Sans", system-ui, sans-serif; font-size: 16px; line-height: 1.5; }
    h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; margin: 0 0 0.25rem; font-size: 1.9rem; }
    .wrap { width: min(720px, 100% - 2rem); margin: 0 auto; }
    header { background: var(--bark); }
    header .wrap { display: flex; align-items: center; gap: 1rem; height: 64px; }
    header img { height: 40px; width: auto; }
    header .spacer { flex: 1; }
    header a { color: #f2ebe0; font-size: 0.9rem; }
    main { padding: 2rem 0 4rem; }
    .lead { color: var(--muted); margin: 0 0 1.5rem; }

    .rooms { display: grid; gap: 0.75rem; }
    .room { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 1rem; align-items: start; background: #fff; border: 1px solid rgba(46, 31, 15, 0.1); border-radius: 14px; padding: 1rem 1.25rem; }
    .room h2 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 1.2rem; margin: 0.4rem 0 0; }
    .field { display: grid; gap: 0.3rem; }
    .field span { font-size: 0.8rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .money { display: flex; align-items: center; border: 1.5px solid rgba(46, 31, 15, 0.2); border-radius: 10px; background: #fff; overflow: hidden; }
    .money:focus-within { border-color: var(--amber); }
    .money b { padding: 0 0.6rem; color: var(--muted); font-weight: 500; }
    .money input { font: inherit; font-size: 1.1rem; border: 0; outline: 0; padding: 0.55rem 0.6rem 0.55rem 0; width: 100%; min-width: 0; background: transparent; }
    .hint { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }

    .bar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 1rem; margin-top: 1.5rem; padding: 1rem 0; background: var(--cream); }
    .btn { border: 0; border-radius: 999px; padding: 0.75rem 1.6rem; font: inherit; font-weight: 500; background: var(--amber); color: #fff; cursor: pointer; }
    .btn:hover { background: #a9770f; }
    .btn[disabled] { opacity: 0.6; cursor: not-allowed; }
    .status { font-size: 0.95rem; }
    .status.ok { color: var(--leaf); }
    .status.err { color: var(--danger); }

    @media (max-width: 560px) {
      .room { grid-template-columns: 1fr 1fr; }
      .room h2 { grid-column: 1 / -1; margin: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <img src="/media/logo/yellow_logo_transparent.png" alt="Mayhome">
      <div class="spacer"></div>
      <a href="/" target="_blank" rel="noopener">View website ↗</a>
    </div>
  </header>

  <main class="wrap">
    <h1>Room prices</h1>
    <p class="lead">Monthly price for each room. The website shows dollars in English and đồng in Vietnamese. Changes appear on the website within a minute of saving.</p>

    <p id="loading">Loading…</p>
    <form id="form" hidden>
      <div class="rooms" id="rooms"></div>
      <div class="bar">
        <button class="btn" id="save" type="submit">Save prices</button>
        <span class="status" id="status" role="status"></span>
      </div>
    </form>
  </main>

  <template id="room-tpl">
    <div class="room">
      <h2></h2>
      <label class="field">
        <span>Dollars / month</span>
        <div class="money"><b>$</b><input type="number" class="usd" min="1" max="100000" step="1" required inputmode="numeric"></div>
      </label>
      <label class="field">
        <span>Đồng / month</span>
        <div class="money"><b>₫</b><input type="number" class="vnd" min="1000" max="10000000000" step="1" required inputmode="numeric"></div>
        <div class="hint"></div>
      </label>
    </div>
  </template>

  <script>
    const form = document.getElementById("form");
    const list = document.getElementById("rooms");
    const status = document.getElementById("status");
    const saveBtn = document.getElementById("save");

    const setStatus = (text, kind = "") => { status.textContent = text; status.className = "status " + kind; };
    // 8000000 → "8.000.000 ₫", so a missing or extra zero is easy to spot
    const showVnd = (row) => {
      const v = Number(row.querySelector(".vnd").value);
      row.querySelector(".hint").textContent = v ? v.toLocaleString("vi-VN") + " ₫" : "";
    };

    function render(rooms) {
      list.innerHTML = "";
      for (const r of rooms) {
        const row = document.getElementById("room-tpl").content.firstElementChild.cloneNode(true);
        row.querySelector("h2").textContent = r.name;
        row.querySelector(".usd").value = r.usd;
        row.querySelector(".vnd").value = r.vnd;
        row.querySelector(".vnd").addEventListener("input", () => showVnd(row));
        showVnd(row);
        list.append(row);
      }
    }

    async function load() {
      try {
        const res = await fetch("/office/api/prices", { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        render(data.rooms);
        document.getElementById("loading").hidden = true;
        form.hidden = false;
      } catch (err) {
        document.getElementById("loading").textContent = "Could not load the prices. Please refresh the page (you may need to sign in again).";
      }
    }

    form.addEventListener("input", () => setStatus(""));
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const rooms = [...list.children].map((row) => ({
        usd: Number(row.querySelector(".usd").value),
        vnd: Number(row.querySelector(".vnd").value),
      }));
      saveBtn.disabled = true;
      setStatus("Saving…");
      try {
        const res = await fetch("/office/api/prices", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(rooms) });
        const data = await res.json().catch(() => ({ ok: false, error: "Please refresh the page and sign in again." }));
        if (!data.ok) throw new Error(data.error);
        render(data.rooms);
        setStatus("Saved ✓", "ok");
      } catch (err) {
        setStatus("Not saved: " + err.message, "err");
      } finally {
        saveBtn.disabled = false;
      }
    });

    load();
  </script>
</body>
</html>
